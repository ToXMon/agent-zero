# Nginx reverse proxy configuration for Agent Zero on Akash
# This sits in front of uvicorn and handles WebSocket upgrades with
# extended timeouts to survive long-running operations.

upstream agent_zero {
    server 127.0.0.1:5000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Large uploads (backups, file uploads)
    client_max_body_size 5G;

    # Disable buffering for real-time streaming
    proxy_buffering off;
    proxy_cache off;

    # --- WebSocket: Socket.IO endpoint ---
    location /socket.io/ {
        proxy_pass http://agent_zero;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Extended timeouts for WebSocket connections
        # These must be longer than Socket.IO's ping_interval + ping_timeout
        # to prevent nginx from closing the connection during long operations
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;    # 24 hours
        proxy_read_timeout 86400s;    # 24 hours

        # No buffering for real-time WebSocket
        proxy_buffering off;
    }

    # --- All other HTTP traffic ---
    location / {
        proxy_pass http://agent_zero;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard HTTP timeouts (generous for large file uploads)
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Allow large request bodies
        client_max_body_size 5G;
    }

    # Health check endpoint (bypass proxy for speed)
    location = /health {
        proxy_pass http://agent_zero;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}
